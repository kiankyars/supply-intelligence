name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Run full test suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v
      - name: Exercise clean-clone Data Center bridge
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m supply_intelligence import-datacenter-power \
            --release-dir examples/fixtures/datacenter-atlas/2026-07-17-openai-abilene \
            --selection examples/datacenter-openai-abilene-operational-2026q3-selection.json \
            > "$RUNNER_TEMP/abilene-import.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          actual = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "abilene-import.json").read_text()
          )
          expected = json.loads(
              Path(
                  "examples/datacenter-openai-abilene-operational-2026q3-import.json"
              ).read_text()
          )
          if actual != expected:
              raise SystemExit("checked Data Center adapter output drifted")
          PY
