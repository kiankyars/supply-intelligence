[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-supply-intelligence"
version = "0.1.0"
description = "Evidence-backed quarterly reconciliation of complete AI-system supply"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ai-supply = "supply_intelligence.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["supply_intelligence*"]
